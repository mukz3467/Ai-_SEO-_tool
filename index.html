<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZyvenSEO AI</title><style>body{margin:0;background:#050812;color:#f6f8ff;font:14px system-ui;padding:18px}.app{max-width:1100px;margin:auto}.card{background:#0b1220;border:1px solid #263650;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:380px 1fr;gap:14px}input,textarea,select,button{width:100%;box-sizing:border-box;margin:6px 0;padding:11px;border-radius:9px;border:1px solid #2a3a56;background:#07101c;color:white}button{cursor:pointer;background:#6357df;border:0;font-weight:700}.tabs{display:flex;gap:6px}.tabs button{background:#111c2d}.tabs button.active{background:#6357df}.drop{border:1px dashed #40506d;padding:20px;text-align:center;border-radius:12px}.preview{min-height:100px;display:grid;place-items:center;background:#060c15;border-radius:10px;margin:8px 0}.preview img,.preview video{max-width:100%;max-height:230px}.platform{border:1px solid #263650;border-radius:12px;padding:12px;margin:8px 0}.chip{display:inline-block;background:#121d2e;border:1px solid #293954;padding:4px 7px;border-radius:20px;margin:3px;font-size:11px}.score{font-size:32px;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>⚡ ZyvenSEO AI</h1><p>Evidence-first SEO for YouTube · Instagram · TikTok · Facebook · Pinterest</p><div class="grid"><section class="card"><div class="tabs"><button class="active" data-t="video">Video</button><button data-t="image">Image</button><button data-t="audio">Audio</button><button data-t="text">Text</button></div><div class="drop"><b id="dt">Upload your video</b><input id="f" type="file"></div><div id="pv" class="preview">Preview</div><textarea id="ctx" placeholder="Extra context / transcript / verified facts"></textarea><select id="aud"><option>US / English</option><option>Global English</option><option>Pakistan / Urdu</option></select><input id="kw" placeholder="Primary keyword (optional)"><input id="ep" placeholder="Cloudflare Worker URL ending /analyze"><button id="go">Analyze real content</button><div id="err"></div></section><section class="card"><div id="out"><h2>AI SEO INTELLIGENCE</h2><p>Upload source and analyze.</p></div></section></div></main><script>const $=x=>document.querySelector(x);let type='video',file=null,last=null;const names={video:'Upload your video',image:'Upload image or banner',audio:'Upload audio',text:'Upload text file'};document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#dt').textContent=names[type];$('#f').value='';file=null});$('#f').onchange=e=>{file=e.target.files[0];if(file){let u=URL.createObjectURL(file);$('#pv').innerHTML=type==='image'?'<img src="'+u+'">':type==='video'?'<video controls src="'+u+'"></video>':file.name}};function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function box(t,v){return '<div class="platform"><b>'+esc(t)+'</b><p>'+esc(v||'Not provided')+'</p></div>'}function pack(n,d){return '<div class="platform"><h3>'+n+' <button style="width:auto;float:right" onclick="cp(\''+n+'\')">Copy</button></h3>'+box('Title',d.title)+(n==='Pinterest'?box('Pin description',d.description):box(n==='YouTube'||n==='Facebook Reels'?'Description':'Caption',d.description||d.caption))+box('Hook',d.hook)+box('CTA',d.cta)+box('Keywords',(d.keywords||[]).join(', '))+box('Hashtags',(d.hashtags||[]).join(' '))+box('Strategy',d.strategy)+'</div>'}function render(r){last=r;let o=r.overall||{};$('#out').innerHTML='<div class="score">'+(o.seo_score||0)+'/100</div>'+box('Main topic',o.main_topic)+box('Search intent',o.search_intent)+box('Primary keyword',o.primary_keyword)+box('Evidence',(o.source_facts||[]).join('\n'))+box('Secondary keywords',(o.secondary_keywords||[]).join(', '))+box('Long-tail',(o.long_tail_keywords||[]).join(', '))+'<h2>Platform packages</h2>'+pack('YouTube',r.youtube||{})+pack('Instagram Reels',r.instagram||{})+pack('TikTok',r.tiktok||{})+pack('Facebook Reels',r.facebook||{})+pack('Pinterest',r.pinterest||{})+box('Evidence note',o.evidence_note)}async function cp(n){let k=n==='YouTube'?'youtube':n==='Instagram Reels'?'instagram':n==='TikTok'?'tiktok':n==='Facebook Reels'?'facebook':'pinterest',d=last[k]||{};await navigator.clipboard.writeText([d.title,d.description||d.caption,d.hook,d.cta,...(d.keywords||[]),...(d.hashtags||[]),d.strategy].filter(Boolean).join('\n\n'))}$('#go').onclick=async()=>{try{if(!file&&!$('#ctx').value.trim())throw Error('Upload content or add text/context.');let ep=$('#ep').value.trim();if(!ep)throw Error('Add the Cloudflare Worker /analyze URL.');$('#go').disabled=true;$('#go').textContent='Analyzing…';let p='Audience='+$('#aud').value+'; Keyword='+($('#kw').value||'none')+'; Context='+($('#ctx').value||'none')+'. Return the complete ZyvenSEO AI JSON schema with overall evidence ledger and all five platforms. Detect category dynamically.';let h={'X-SEO-Prompt':p,'X-SEO-Mime':file?.type||'text/plain','X-SEO-Filename':file?.name||'context.txt'},body=type==='text'&&file?await file.text():file||new Blob([$('#ctx').value],{type:'text/plain'});let r=await fetch(ep,{method:'POST',headers:h,body}),d=await r.json();if(!r.ok)throw Error(d.error||'Analysis failed');render(JSON.parse(d.text))}catch(e){$('#err').textContent=e.message}finally{$('#go').disabled=false;$('#go').textContent='Analyze real content'}};</script></body></html>
